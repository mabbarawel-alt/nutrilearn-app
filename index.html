<!DOCTYPE html>
<html lang="fil">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description"
    content="NutriLearn Calabanga - Plataporma sa Nutrisyon ng Bata at Pagsubaybay sa Malnutrisyon para sa Bayan ng Calabanga at Barangay Paolbo">
  <title>NutriLearn Calabanga - Barangay Paolbo</title>

  <!-- Google Fonts: Lora, Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- App Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Mobile Viewport Container -->
  <div class="app-viewport">

    <!-- 1. AUTHENTICATION & ROLE SELECTION VIEW (Shown when logged out) -->
    <div id="auth-view" style="display:none;"></div>

    <!-- 2. MAIN APPLICATION SHELL (Shown when logged in) -->
    <div id="main-app-layout" style="display:none; flex-direction:column; flex:1;">

      <!-- App Header -->
      <header class="app-header">
        <div class="header-top">
          <div class="brand-badge">
            <div class="brand-text">
              <h1 id="header-portal-title">NutriLearn Calabanga</h1>
              <span id="header-portal-subtitle">Bayan ng Calabanga • Barangay Paolbo</span>
            </div>
          </div>

          <div class="header-actions">
            <!-- Child Switcher (Only visible for parents with multiple children) -->
            <button id="btn-child-switcher" class="header-action-btn btn-switcher-pill"
              title="Palitan ang Profile ng Bata" onclick="window.app.openChildSwitcher()" style="display:none;">
              Palitan
            </button>
            <button class="header-action-btn btn-setting-pill" title="Mga Setting" onclick="window.app.openSettings()">
              Setting
            </button>
            <button class="header-action-btn btn-logout-pill" title="Lumabas sa Account" onclick="window.app.logout()">
              Lumabas
            </button>
          </div>
        </div>
      </header>

      <!-- Network & Sync Status Strip -->
      <div class="status-strip">
        <div class="status-online" id="network-status-text">
          <span class="dot-pulse"></span>
          <span>Handa kahit Offline • Lokal na Database</span>
        </div>
        <button class="status-sync-btn"
          onclick="window.app.showToast('Nai-sync sa Tanggapan ng Kalusugan ng Calabanga', 'success')">
          I-sync
        </button>
      </div>

      <!-- Main Content Views -->
      <main class="app-content">
        <!-- 1. Parent & Caregiver View -->
        <section id="parent-view" style="display:none;"></section>

        <!-- 2. Barangay Health Worker View -->
        <section id="chw-view" style="display:none;"></section>

        <!-- 3. Supervisor & Public Health Surveillance View -->
        <section id="supervisor-view" style="display:none;"></section>

        <!-- Developer Credits Footer -->
        <footer
          style="text-align:center; padding:16px 12px 24px 12px; font-size:0.72rem; color:var(--text-muted); border-top:1px solid #e2e8f0; margin-top:20px;">
          <div>NutriLearn • Bayan ng Calabanga at Barangay Paolbo</div>
          <div style="margin-top:2px;">Credits to the Owner • Developer: <strong
              style="color:var(--primary); font-weight:800;">NEXORA</strong></div>
        </footer>
      </main>

      <!-- Role-Specific Bottom Navigation Bar -->
      <nav class="bottom-nav" id="app-bottom-nav">
        <!-- Injected dynamically via app.js depending on active role -->
      </nav>

    </div>

  </div>

  <!-- Global Modal Dialog Container -->
  <div class="modal-overlay" id="app-modal" onclick="if(event.target === this) window.app.closeModal();">
    <div class="modal-card">
      <div class="modal-header">
        <div style="font-size:0.75rem; font-weight:700; color:var(--primary); text-transform:uppercase;">NutriLearn
          Calabanga • Barangay Paolbo</div>
        <button class="modal-close" onclick="window.app.closeModal()">✕</button>
      </div>
      <div id="modal-content-area"></div>
    </div>
  </div>

  <!-- Global Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Application Logic Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/parent-portal.js"></script>
  <script src="js/chw-toolkit.js"></script>
  <script src="js/supervisor-dashboard.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
