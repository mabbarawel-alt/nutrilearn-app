<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="NutriLearn - E-learning and Malnutrition Surveillance Application for Parents and Community Health Workers">
  <title>NutriLearn - Child Nutrition & Malnutrition Surveillance</title>

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- App Icon & Stylesheet -->
  <link rel="icon" type="image/jpeg" href="assets/icon.jpg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Mobile Viewport Container -->
  <div class="app-viewport">

    <!-- 1. AUTHENTICATION & ROLE SELECTION VIEW (Shown when logged out) -->
    <div id="auth-view" style="display:none;"></div>

    <!-- 2. MAIN APPLICATION SHELL (Shown when logged in) -->
    <div id="main-app-layout" style="display:none; flex-direction:column; flex:1;">
      
      <!-- App Header -->
      <header class="app-header">
        <div class="header-top">
          <div class="brand-badge">
            <img src="assets/icon.jpg" alt="NutriLearn Logo" style="width:36px; height:36px; border-radius:10px; object-fit:cover; border:1px solid rgba(255,255,255,0.4); box-shadow:0 2px 6px rgba(0,0,0,0.15);">
            <div class="brand-text">
              <h1 id="header-portal-title">NutriLearn</h1>
              <span id="header-portal-subtitle">Child Nutrition & Surveillance</span>
            </div>
          </div>

          <div class="header-actions">
            <!-- Child Switcher (Only visible for parents with multiple children) -->
            <button id="btn-child-switcher" class="btn-icon" title="Switch Child Profile" onclick="window.app.openChildSwitcher()" style="display:none;">
              👶
            </button>
            <button class="btn-icon" title="Settings & Info" onclick="window.app.openSettings()">
              ⚙️
            </button>
            <button class="btn-icon btn-icon-logout" title="Log Out / Switch Account" onclick="window.app.logout()">
              🚪
            </button>
          </div>
        </div>

        <!-- User Identity Strip inside Header -->
        <div class="user-profile-strip" id="user-profile-strip">
          <div class="user-strip-info">
            <span class="user-strip-avatar" id="user-strip-avatar">👩</span>
            <div>
              <div class="user-strip-name" id="user-strip-name">Elena Reyes</div>
              <div class="user-strip-detail" id="user-strip-detail">Parent of Baby Maya • Barangay San Isidro</div>
            </div>
          </div>
          <button class="btn-logout-chip" onclick="window.app.logout()">
            Switch User
          </button>
        </div>
      </header>

      <!-- Network & Sync Status Strip -->
      <div class="status-strip">
        <div class="status-online" id="network-status-text">
          <span class="dot-pulse"></span>
          <span>Offline Ready • Local Database Active</span>
        </div>
        <div style="cursor:pointer;" onclick="window.app.showToast('Synchronized with Community Health Cloud ☁️', 'success')">
          🔄 Sync
        </div>
      </div>

      <!-- Main Content Views -->
      <main class="app-content">
        <!-- 1. Parent & Caregiver View -->
        <section id="parent-view" style="display:none;"></section>

        <!-- 2. Community Health Worker View -->
        <section id="chw-view" style="display:none;"></section>

        <!-- 3. Supervisor & Public Health Surveillance View -->
        <section id="supervisor-view" style="display:none;"></section>
      </main>

      <!-- Role-Specific Bottom Navigation Bar -->
      <nav class="bottom-nav" id="app-bottom-nav">
        <!-- Injected dynamically via app.js depending on active role -->
      </nav>

    </div>

  </div>

  <!-- Global Modal Dialog Container -->
  <div class="modal-overlay" id="app-modal" onclick="if(event.target === this) window.app.closeModal();">
    <div class="modal-card">
      <div class="modal-header">
        <div style="font-size:0.75rem; font-weight:700; color:var(--primary); text-transform:uppercase;">NutriLearn Mobile</div>
        <button class="modal-close" onclick="window.app.closeModal()">✕</button>
      </div>
      <div id="modal-content-area"></div>
    </div>
  </div>

  <!-- Global Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Application Logic Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/parent-portal.js"></script>
  <script src="js/chw-toolkit.js"></script>
  <script src="js/supervisor-dashboard.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
